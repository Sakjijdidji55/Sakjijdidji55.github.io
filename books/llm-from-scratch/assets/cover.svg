<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" role="img" aria-label="从零构建大语言模型">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1228"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#3b1d78"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,.055)" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <rect width="640" height="900" fill="url(#bg)"/>
  <rect width="640" height="900" fill="url(#grid)"/>
  <circle cx="540" cy="120" r="150" fill="#38bdf8" opacity=".18" filter="url(#blur)"/>
  <circle cx="90" cy="780" r="170" fill="#8b5cf6" opacity=".18" filter="url(#blur)"/>

  <text x="470" y="330" font-family="'Segoe UI', Arial, sans-serif" font-size="300" font-weight="700" fill="#ffffff" opacity=".045">LLM</text>

  <g stroke="url(#line)" stroke-width="1.2" opacity=".55" fill="none">
    <path d="M430 190 L500 150 L560 210 L520 270 L450 250 Z"/>
    <path d="M430 190 L560 210 M500 150 L520 270 M450 250 L560 210"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="430" cy="190" r="4"/><circle cx="500" cy="150" r="4"/><circle cx="560" cy="210" r="4"/>
    <circle cx="520" cy="270" r="4"/><circle cx="450" cy="250" r="4"/>
  </g>

  <text x="64" y="120" font-family="'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="5" fill="#93c5fd">FROM SCRATCH</text>
  <text x="64" y="150" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" letter-spacing="2" fill="#c4b5fd">中 文 精 读 笔 记</text>

  <rect x="64" y="196" width="56" height="6" rx="3" fill="url(#line)"/>

  <text x="64" y="420" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="62" font-weight="700" fill="#ffffff">从零构建</text>
  <text x="64" y="500" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="62" font-weight="700" fill="#ffffff">大语言模型</text>

  <text x="64" y="560" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#93c5fd">Build a Large Language Model</text>
  <text x="64" y="592" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#93c5fd">from Scratch</text>

  <line x1="64" y1="650" x2="576" y2="650" stroke="rgba(255,255,255,.16)"/>

  <text x="64" y="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" fill="#cbd5e1">Transformer · 注意力机制 · 预训练 · 微调 · LoRA</text>

  <g font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="64" y="746" width="86" height="34" rx="17" fill="rgba(125,211,252,.13)" stroke="rgba(125,211,252,.35)"/>
    <text x="86" y="768">PyTorch</text>
    <rect x="162" y="746" width="86" height="34" rx="17" fill="rgba(167,139,250,.13)" stroke="rgba(167,139,250,.35)"/>
    <text x="184" y="768">GPT</text>
    <rect x="260" y="746" width="86" height="34" rx="17" fill="rgba(125,211,252,.13)" stroke="rgba(125,211,252,.35)"/>
    <text x="282" y="768">LLM</text>
  </g>

  <text x="64" y="852" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" fill="#94a3b8">迷路的小朋友 · 个人书架</text>
</svg>
